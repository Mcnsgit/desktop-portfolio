name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]


jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      
      - name: Setup pnpm
        uses: pnpm/actions-setup@v4
        with:
          version: 9    
          run_install: true

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        
